  <path d="M700,140 H660 V60 H384 V100" stroke="#bdbdb7" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="664" y="54" fill="#8f8f89" font-size="11">ask / pay</text>
  <path d="M317,298 V330 H818 V208" stroke="#e4a340" stroke-width="1.4" fill="none" marker-end="url(#g)"/>
  <text x="628" y="324" fill="#e4a340" font-size="11">reading + receipt</text>
  <path d="M522,292 V346" stroke="#bdbdb7" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M604,382 H694" stroke="#bdbdb7" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
