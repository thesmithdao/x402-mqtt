connection sensor-upstream
address machines.cultos.dev:8883
remote_clientid sensor-bridge
remote_username YOUR_DEVICE_USERNAME
remote_password YOUR_DEVICE_PASSWORD
bridge_cafile /etc/ssl/certs/ca-certificates.crt
bridge_insecure false
bridge_protocol_version mqttv311
try_private false
start_type automatic
cleansession true
notifications false
restart_timeout 5 30
topic raw/temperatura out 0
topic raw/umidade out 0
