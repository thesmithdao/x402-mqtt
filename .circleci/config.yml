version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/node:22.18
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Build
          command: npm run build
      - run:
          name: Test
          command: npm test

  verify-node-20:
    docker:
      - image: cimg/node:20.19
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Build
          command: npm run build
      - run:
          name: Test
          command: npm test

  audit:
    docker:
      - image: cimg/node:22.18
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Audit dependencies
          command: npm audit --audit-level=high || true

workflows:
  verify:
    jobs:
      - verify
      - verify-node-20
      - audit
